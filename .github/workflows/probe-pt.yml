# One-off: can GitHub's runners reach Portugal's DGEG fuel price API? Delete after reading the log.
name: Source probe (Portugal)
on:
  push:
    paths: ['.github/workflows/probe-pt.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Portugal (DGEG precoscombustiveis)
        run: |
          for u in \
            "https://precoscombustiveis.dgeg.gov.pt/api/PrecoComb/GetTiposCombustiveis" \
            "https://precoscombustiveis.dgeg.gov.pt/api/PrecoComb/PesquisarPostos?idsTiposComb=&idMarca=&idTipoPosto=&idDistrito=&idsMunicipios=&qtdPorPagina=20000&pagina=1"; do
            echo "== $u"
            curl -sS -L --compressed -m 120 -o body -w "HTTP %{http_code}, %{size_download} bytes, %{time_total}s\n" "$u" || echo "request failed"
            head -c 300 body; echo
          done
