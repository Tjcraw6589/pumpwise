name: Probe a price source
on:
  push:
    branches: [probe-uk]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Danish chains and address lookups
        run: |
          python3 - <<'P'
          import json, urllib.request, gzip, collections
          req = urllib.request.Request('https://api.circlek.com/eu/prices/v1/fuel/countries/DK', headers={'User-Agent': 'Pumpwise feed (pumpwiseapp@gmail.com)', 'Accept': 'application/json', 'X-App-Name': 'PRICES'})
          raw = urllib.request.urlopen(req, timeout=40).read()
          if raw[:2] == b'\x1f\x8b': raw = gzip.decompress(raw)
          d = json.loads(raw)
          print('CK top', type(d).__name__, list(d.keys())[:12] if isinstance(d, dict) else len(d), len(raw))
          arr = d if isinstance(d, list) else next((v for v in d.values() if isinstance(v, list)), [])
          print('CK n', len(arr)); print('CK sample', json.dumps(arr[0])[:1800]); print('CK sample2', json.dumps(arr[len(arr)//2])[:1200])
          print('CK keys', collections.Counter(k for x in arr for k in x.keys()).most_common(30))
          for k in ('brand','brandName','siteBrand','stationBrand','type','country'):
              c = collections.Counter(str(x.get(k)) for x in arr)
              if len(c) > 1 or None not in [x.get(k) for x in arr[:1]]: print('CK', k, c.most_common(8))
          P
