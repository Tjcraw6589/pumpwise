name: probe
on:
  push:
    branches: [probe-audit]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: |
          set +e
          R=$(curl -s -H 'Accept: application/json' "https://check-host.net/check-http?host=https://www.mimit.gov.it/images/exportCSV/anagrafica_impianti_attivi.csv&max_nodes=40")
          echo "$R" | head -c 600; echo
          ID=$(echo "$R" | python3 -c "import sys,json; print(json.load(sys.stdin)['request_id'])")
          sleep 25
          curl -s -H 'Accept: application/json' "https://check-host.net/check-result/$ID" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for k,v in sorted(d.items()):
              print(k, '->', (str(v[0][:4]) if v and v[0] else str(v))[:110])
          "
