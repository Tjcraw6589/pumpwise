name: probe
on:
  push:
    branches: [probe-audit]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: |
          set +e
          U=https://cuxmtbyqffxgsdduhoad.supabase.co/functions/v1/it-open-data
          for f in prezzo anagrafica; do
            curl -sS -D /tmp/h -o /tmp/$f.csv -w "== $f http=%{http_code} time=%{time_total} size=%{size_download}\n" --max-time 90 -H 'x-region: eu-central-1' "$U?f=$f"
            grep -i 'x-pumpwise\|x-sb-edge-region\|content-type' /tmp/h | tr '\r\n' '  '; echo
            head -4 /tmp/$f.csv; wc -l /tmp/$f.csv
          done
          echo "== fuels"; tail -n +3 /tmp/prezzo.csv | cut -d'|' -f2 | sort | uniq -c | sort -rn | head -70
          echo "== self"; tail -n +3 /tmp/prezzo.csv | cut -d'|' -f4 | sort | uniq -c
          echo "== dates"; tail -n +3 /tmp/prezzo.csv | cut -d'|' -f5 | cut -c1-10 | sort -t/ -k3,3 -k2,2 -k1,1 | uniq -c | tail -12
          echo "== tipo"; tail -n +3 /tmp/anagrafica.csv | cut -d'|' -f4 | sort | uniq -c
          echo "== bandiera"; tail -n +3 /tmp/anagrafica.csv | cut -d'|' -f3 | sort | uniq -c | sort -rn | head -25
          echo "== fields"; tail -n +3 /tmp/anagrafica.csv | awk -F'|' '{print NF}' | sort | uniq -c; tail -n +3 /tmp/prezzo.csv | awk -F'|' '{print NF}' | sort | uniq -c
          echo "== sample"; sed -n '2000,2004p' /tmp/anagrafica.csv; grep -c '||$\|NULL' /tmp/anagrafica.csv
          echo "== without region header"; curl -sS -o /dev/null -D - --max-time 60 "$U?f=anagrafica" | grep -i 'HTTP/\|x-pumpwise\|x-sb-edge-region' | tr '\r\n' '  '
