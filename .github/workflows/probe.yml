name: probe
on:
  push:
    branches: [probe-audit]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: |
          set +e
          for f in prezzo_alle_8 anagrafica_impianti_attivi; do
            echo "== save $f"
            curl -sS -L -o /tmp/$f.csv -w 'http=%{http_code} url=%{url_effective} time=%{time_total} size=%{size_download}\n' --max-time 240 -A 'Pumpwise (pumpwiseapp@gmail.com; https://pumpwiseapp.com)' "https://web.archive.org/save/https://www.mimit.gov.it/images/exportCSV/$f.csv"
            head -c 400 /tmp/$f.csv | tr '\n' ' '; echo; wc -l /tmp/$f.csv
            echo "== latest id_ $f"
            curl -sS -L -o /tmp/l.csv -w 'http=%{http_code} url=%{url_effective} size=%{size_download}\n' --max-time 120 "https://web.archive.org/web/2026id_/https://www.mimit.gov.it/images/exportCSV/$f.csv"; head -c 200 /tmp/l.csv | tr '\n' ' '; echo
            sleep 8
          done
