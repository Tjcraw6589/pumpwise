# One-off check, run when this file changes: can GitHub's servers reach the Italian and Argentine
# government fuel price files? (They time out from the owner's computer.) Prints the answer status,
# size and the first lines of each file. Safe to delete once read.
name: Source probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Italy (MIMIT) and Argentina (Secretaría de Energía)
        run: |
          for u in \
            "https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv" \
            "https://www.mimit.gov.it/images/exportCSV/anagrafica_impianti_attivi.csv" \
            "https://datos.gob.ar/dataset/energia-precios-surtidor---resolucion-3142016" \
            "http://datos.energia.gob.ar/dataset/1c181390-5045-475e-94dc-410429be4b17/resource/80ac25de-a44a-4445-9215-090cf55cfda5/download/precios-en-surtidor-resolucin-3142016.csv"; do
            echo "== $u"
            curl -sS -L --max-time 150 -A "Pumpwise-feed/2.0 (+https://tjcraw6589.github.io/pumpwise/)" -o body \
              -w "HTTP %{http_code}, %{size_download} bytes, %{time_total}s, last-modified check below\n" "$u" || echo "request failed"
            head -c 600 body | tr -d '\r' || true
            echo
            echo "-- lines: $(wc -l < body 2>/dev/null || echo 0)"
          done
