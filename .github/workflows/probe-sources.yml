# Temporary: checks from GitHub's servers which candidate fuel price sources answer and in what format.
# Run by hand (workflow_dispatch); removed once the new sources are written.
name: Probe sources
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        run: |
          UA="Pumpwise/1.0 (+https://pumpwiseapp.com)"
          code() { echo "$1 -> $(curl -s $3 -A "$UA" --max-time ${2:-25} -o /dev/null -w '%{http_code} %{size_download}' "$1" || echo fail)"; }
          code https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv 25 -4
          code https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv 25 -6
          code https://carburanti.mise.gov.it/ospzSearch/home 25
          code https://www.dati.gov.it/ 20
          code "https://datos.gob.ar/api/3/action/package_search?q=surtidor" 25
          code https://datos.energia.gob.ar/ 20
          curl -sSL -A "$UA" --max-time 60 -o hr.json https://mzoe-gor.hr/data.json
          python3 - <<'PY'
          import json, collections
          d = json.load(open('hr.json'))
          print('top keys:', list(d.keys()))
          for k, v in d.items():
              if isinstance(v, list):
                  print(k, len(v), json.dumps(v[0], ensure_ascii=False)[:600] if v and k != 'postajas' else '')
          p = d['postajas'][0]
          print('station keys:', list(p.keys()))
          ids = collections.Counter(c['gorivo_id'] for s in d['postajas'] for c in s.get('cjenici', []))
          print('gorivo ids (top 20):', ids.most_common(20))
          print('stations with prices:', sum(1 for s in d['postajas'] if s.get('cjenici')))
          PY
          curl -sSL -A "$UA" --max-time 30 "https://goriva.si/api/v1/search/?format=json&page_size=1000" -o si.json
          python3 - <<'PY'
          import json
          d = json.load(open('si.json'))
          print('si count', d.get('count'), 'results this page', len(d.get('results', [])), 'next', d.get('next'))
          r = d['results'][0]
          print(json.dumps(r, ensure_ascii=False)[:900])
          PY
          curl -sSL -A "$UA" --max-time 30 "https://goriva.si/api/v1/?format=json" | head -c 800; echo
          curl -sSL -A "$UA" --max-time 30 "https://goriva.si/api/v1/settings/?format=json" | head -c 1500; echo
