# Collects official fuel prices and publishes them, with the website and legal pages, on GitHub Pages.
# Free on a public repository. Runs every 15 minutes: each run publishes, waits for the next quarter
# hour (:07, :22, :37, :52) and starts the next run itself, because GitHub's own scheduler only gets
# round to free repositories every few hours. The schedule below stays as a backup that restarts the
# chain if it ever breaks. To stop the chain, set the repository variable FEED_CHAIN to "off".
# Each source refreshes on its own schedule (FuelWatch, Western Australia: hourly and straight after
# 6am and 2:30pm Perth, no key needed; NSW FuelCheck with the ACT and Tasmania: every 45 minutes,
# only when the NSW_FUEL_API_KEY and NSW_FUEL_API_SECRET secrets exist; Spain every 30 minutes,
# France every run and Mexico every 3 hours, no keys needed; Queensland only when the
# QLD_FUEL_API_TOKEN secret exists).
# The site carries data/v6 (every region, the United Kingdom included, for Pumpwise 1.4), data/v5 (for 1.3), data/v4
# (the regions Pumpwise 1.2 knows), data/v3 (WA, NSW, ACT, Tasmania, for
# 1.1) and data/v2 (Western Australia only, for 1.0). The UK Fuel Finder source only runs
# when FUEL_FINDER_CLIENT_ID and FUEL_FINDER_CLIENT_SECRET secrets exist, and that service refuses
# connections from outside the UK, so it stays off on GitHub's servers.
# After the feed, the job writes the price pages (prices/, see scripts/prices-site): a step that may
# fail without affecting the feed.
name: Price feed

on:
  schedule:
    # Backup only: restarts the 15-minute chain if it stops. Off the hour, when GitHub is less busy.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/feed/**'
      - 'scripts/prices-site/**'
      - 'src/lib/feed.ts'
      - '.github/workflows/feed.yml'

# contents: write is for one thing only: saving the day's average prices to the "stats" branch (see below).
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The Stats page's history lives on the "stats" branch: one line of averages per day. It is checked
      # out here, read and updated by the price pages step, and committed back below. If the branch cannot
      # be checked out the page is drawn from today alone and nothing is saved.
      # The same branch keeps dk-places.json: where the Danish stations that publish only an address are
      # (see scripts/feed/sources/dk.ts), so each address is looked up once.
      - name: Fetch the saved daily averages
        id: stats
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: stats
          path: .stats
      - name: Build the feed and site
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/feed/build.ts
        env:
          FUEL_FINDER_CLIENT_ID: ${{ secrets.FUEL_FINDER_CLIENT_ID }}
          FUEL_FINDER_CLIENT_SECRET: ${{ secrets.FUEL_FINDER_CLIENT_SECRET }}
          NSW_FUEL_API_KEY: ${{ secrets.NSW_FUEL_API_KEY }}
          NSW_FUEL_API_SECRET: ${{ secrets.NSW_FUEL_API_SECRET }}
          QLD_FUEL_API_TOKEN: ${{ secrets.QLD_FUEL_API_TOKEN }}
          GEO_DIR: ${{ steps.stats.outcome == 'success' && '.stats' || '' }}
      # Fuel price pages for the website (prices/: one page per town and city, made from the feed that
      # was just built). Allowed to fail and limited to 3 minutes: if it goes wrong, the feed and the
      # rest of the site are published as usual, only without these pages.
      - name: Price pages for the website
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/prices-site/build.mjs out/site
        env:
          STATS_DIR: ${{ steps.stats.outcome == 'success' && '.stats' || '' }}
      # Committed when the day is new, or every three hours within a day, so the branch gains a handful of
      # small commits a day. A push made with the job's own token starts no other workflow.
      - name: Save the daily averages
        if: steps.stats.outcome == 'success'
        continue-on-error: true
        working-directory: .stats
        run: |
          git add history.json
          if [ -f dk-places.json ]; then git add dk-places.json; fi
          if git diff --cached --quiet; then exit 0; fi
          today=$(date -u +%F)
          last=$(git log -1 --format=%ct)
          # Newly found station positions are always saved, so no address is looked up twice.
          if ! git diff --cached --quiet -- dk-places.json 2>/dev/null; then
            git -c user.name="Pumpwise feed" -c user.email="pumpwiseapp@gmail.com" commit -q -m "Station positions $today"
            git push -q origin HEAD:stats
          elif ! git log -1 --format=%s | grep -q "$today" || [ $(( $(date +%s) - last )) -gt 10800 ]; then
            git -c user.name="Pumpwise feed" -c user.email="pumpwiseapp@gmail.com" commit -q -m "Daily averages $today"
            git push -q origin HEAD:stats
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out/site
      # GitHub pauses scheduled jobs on public repositories after 60 days without activity.
      # Re-enabling the workflow on every run keeps the schedule alive.
      - name: Keep the schedule alive
        if: github.event_name != 'push'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/feed.yml/enable" || true
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Waits for the next quarter hour, then starts the next run. Runs even when the build failed
  # (FuelWatch down, say), so one bad run doesn't stop the updates. Only one run waits at a time:
  # the "pages" concurrency group keeps at most one run queued, so the chain never doubles up.
  next:
    needs: deploy
    if: ${{ !cancelled() && vars.FEED_CHAIN != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for the next quarter hour
        run: |
          now=$(date -u +%s)
          minute=$(( (now / 60) % 60 ))
          # Slots at :07, :22, :37, :52. Start the next run about 40 s early to cover queueing.
          offset=$(( (minute - 7 + 60) % 15 ))
          wait=$(( (15 - offset) * 60 - (now % 60) - 40 ))
          if [ "$wait" -lt 0 ]; then wait=0; fi
          echo "Waiting $wait seconds"
          sleep "$wait"
      - name: Start the next run
        run: gh workflow run feed.yml --ref main -R "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
