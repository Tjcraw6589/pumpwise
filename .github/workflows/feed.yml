# Collects official fuel prices and publishes them, with the website and legal pages, on GitHub Pages.
# Free on a public repository. Runs every 15 minutes: each run publishes, waits for the next quarter
# hour (:07, :22, :37, :52) and starts the next run itself, because GitHub's own scheduler only gets
# round to free repositories every few hours. The schedule below stays as a backup that restarts the
# chain if it ever breaks. To stop the chain, set the repository variable FEED_CHAIN to "off".
# Each source refreshes on its own schedule (FuelWatch, Western Australia: hourly and straight after
# 6am and 2:30pm Perth, no key needed; NSW FuelCheck with the ACT and Tasmania: every 45 minutes,
# only when the NSW_FUEL_API_KEY and NSW_FUEL_API_SECRET secrets exist).
# The site carries data/v3 (every region) and data/v2 (Western Australia only, for Pumpwise 1.0). The UK Fuel Finder source only runs
# when FUEL_FINDER_CLIENT_ID and FUEL_FINDER_CLIENT_SECRET secrets exist, and that service refuses
# connections from outside the UK, so it stays off on GitHub's servers.
name: Price feed

on:
  schedule:
    # Backup only: restarts the 15-minute chain if it stops. Off the hour, when GitHub is less busy.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/feed/**'
      - 'src/lib/feed.ts'
      - '.github/workflows/feed.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the feed and site
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/feed/build.ts
        env:
          FUEL_FINDER_CLIENT_ID: ${{ secrets.FUEL_FINDER_CLIENT_ID }}
          FUEL_FINDER_CLIENT_SECRET: ${{ secrets.FUEL_FINDER_CLIENT_SECRET }}
          NSW_FUEL_API_KEY: ${{ secrets.NSW_FUEL_API_KEY }}
          NSW_FUEL_API_SECRET: ${{ secrets.NSW_FUEL_API_SECRET }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out/site
      # GitHub pauses scheduled jobs on public repositories after 60 days without activity.
      # Re-enabling the workflow on every run keeps the schedule alive.
      - name: Keep the schedule alive
        if: github.event_name != 'push'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/feed.yml/enable" || true
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Waits for the next quarter hour, then starts the next run. Runs even when the build failed
  # (FuelWatch down, say), so one bad run doesn't stop the updates. Only one run waits at a time:
  # the "pages" concurrency group keeps at most one run queued, so the chain never doubles up.
  next:
    needs: deploy
    if: ${{ !cancelled() && vars.FEED_CHAIN != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for the next quarter hour
        run: |
          now=$(date -u +%s)
          minute=$(( (now / 60) % 60 ))
          # Slots at :07, :22, :37, :52. Start the next run about 40 s early to cover queueing.
          offset=$(( (minute - 7 + 60) % 15 ))
          wait=$(( (15 - offset) * 60 - (now % 60) - 40 ))
          if [ "$wait" -lt 0 ]; then wait=0; fi
          echo "Waiting $wait seconds"
          sleep "$wait"
      - name: Start the next run
        run: gh workflow run feed.yml --ref main -R "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
